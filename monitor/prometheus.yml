global:
  scrape_interval: 30s

scrape_configs:
  # router + ISP hop are rediscovered by netinfo.sh on every network
  - job_name: ping
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /probe
    params: { module: [icmp] }
    file_sd_configs: [{ files: [/targets/ping.json], refresh_interval: 30s }]
    static_configs:
      - targets: [1.1.1.1, 8.8.8.8]
        labels: { role: internet }
    # blackbox: probe target comes from __address__, the exporter itself is local
    relabel_configs: &blackbox
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Jio is mostly IPv6; v6 can break or route differently while v4 looks fine
  - job_name: ping6
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /probe
    params: { module: [icmp6] }
    static_configs:
      - targets: ["2606:4700:4700::1111", "2001:4860:4860::8888"]
        labels: { role: internet }
    relabel_configs: *blackbox

  - job_name: region
    metrics_path: /probe
    params: { module: [tcp] }
    static_configs:
      - { targets: ["dynamodb.ap-south-1.amazonaws.com:443"], labels: { region: Mumbai } }
      - { targets: ["dynamodb.ap-south-2.amazonaws.com:443"], labels: { region: Hyderabad } }
      - { targets: ["dynamodb.ap-southeast-1.amazonaws.com:443"], labels: { region: Singapore } }
      - { targets: ["dynamodb.eu-central-1.amazonaws.com:443"], labels: { region: Frankfurt } }
      - { targets: ["dynamodb.us-east-1.amazonaws.com:443"], labels: { region: Virginia } }
    relabel_configs: *blackbox

  - job_name: services
    metrics_path: /probe
    params: { module: [https] }
    static_configs:
      - targets: [https://www.youtube.com, https://github.com, https://slack.com, https://www.amazon.in, https://www.whatsapp.com]
    relabel_configs: *blackbox

  - job_name: dns
    metrics_path: /probe
    params: { module: [dns] }
    file_sd_configs: [{ files: [/targets/ping.json], refresh_interval: 30s }]
    static_configs:
      - targets: [1.1.1.1, 8.8.8.8]
        labels: { role: public-dns }
    relabel_configs:
      - source_labels: [role]
        regex: router|public-dns
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: http
    metrics_path: /probe
    params: { module: [http] }
    static_configs:
      - targets: [https://www.google.com/generate_204]
    relabel_configs: *blackbox

  # each scrape runs a full speedtest (~100 MB); 2h keeps it ~1.2 GB/day on capped plans
  - job_name: speedtest
    scrape_interval: 2h
    scrape_timeout: 2m
    static_configs: [{ targets: ["127.0.0.1:9798"] }]

  - job_name: node
    static_configs: [{ targets: ["127.0.0.1:9100"] }]
